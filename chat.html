<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://sternplatypus-n8n.cloudfy.live; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente CAT Sertão</title>
<meta name="robots" content="noindex, nofollow">
<!-- J5 da auditoria: chat.html está em CACHE_ASSETS (asset do app) e é uma
     URL navegável -- sem estas três tags, quem abrisse direto (ou salvasse
     na tela inicial a partir daqui) perdia a identidade do CBMPE e o
     comportamento de app instalado, ao contrário das outras páginas do
     sistema de sidebar (index/conta/usuarios/log/eventos). -->
<meta name="theme-color" content="#14204A">
<link rel="icon" type="image/png" href="CAT-SERTAO-SEM-FUNDO.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<!-- Public Sans auto-hospedada (ver fonts/fonts.css) -- offline a fonte não
     carregava do CDN do Google e o layout se deslocava (métricas de
     fallback diferentes das da fonte real). O arquivo também declara
     Oswald, sem uso aqui -- @font-face não baixado sem elemento que peça
     essa fonte, então não pesa nada a mais. -->
<link rel="stylesheet" href="fonts/fonts.css">
<!-- @n8n/chat 1.30.2 AUTO-HOSPEDADO em vendor/n8n-chat/ (auditoria de seguranca).
     Antes vinha do cdn.jsdelivr.net. O problema nao era a versao (ja estava fixada em
     1.30.2 de proposito, porque "latest" ja quebrou o padding do campo de mensagem uma
     vez): e que esta pagina roda no MESMO ORIGIN do site, sem sandbox no iframe, entao
     qualquer codigo carregado aqui enxerga localStorage['cat_session'] -- o token de 8h
     de todo usuario logado. Um comprometimento do CDN ou do pacote publicado virava
     roubo de sessao. Servindo do proprio repositorio, o unico jeito de trocar esse
     codigo e um commit aqui.

     Arquivos vendorizados (baixados do jsDelivr, conferidos byte a byte contra o unpkg):
       chat.bundle.es.js         sha256 4cf6c312a7986abaf80588abd7d757830e9ad20d02d06e37f2be17ecc08ab441
       node-icons--8EUtRWq.mjs   sha256 33d7dd491bd3924e08381d5858a50eb13951433ca030269556c328a342dcb8ce
       style.css                 sha256 6559919c89717ef666992df6a6035dcbbff7194e0ef81d20d0079550882b48a2

     node-icons--8EUtRWq.mjs NAO e opcional: o bundle faz import() dinamico dele em
     tempo de execucao, relativo a propria URL do modulo -- sem esse arquivo ao lado,
     a chamada 404 em producao e so quebra quando alguem usa a funcionalidade.

     Ao ATUALIZAR de versao: baixe os tres arquivos da nova versao, confira os hashes em
     duas fontes, confirme se o nome do chunk node-icons mudou (o hash faz parte do
     nome), atualize os hashes deste comentario e teste visualmente antes de publicar. -->
<link rel="stylesheet" href="vendor/n8n-chat/style.css">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:'Public Sans', sans-serif; }
  #n8n-chat{
    height:100%;
    --chat--color-primary: #C1121F;
    --chat--color-primary-shade-50: #97121A;
    --chat--color-secondary: #14204A;
    --chat--color-secondary-shade-50: #1B2A5B;
    --chat--border-radius: 10px;
    --chat--spacing: 14px;
    --chat--font-family: 'Public Sans', sans-serif;
    --chat--header--background: #14204A;
    --chat--header--color: #fff;
    --chat--header--padding: 18px 20px;
    --chat--heading--font-size: 18px;
    --chat--subtitle--line-height: 1.4;
    --chat--message--font-size: 14.5px;
    --chat--input--font-size: 14.5px;
    --chat--input--placeholder--font-size: 14.5px;
    --chat--message--border-radius: 12px;
    --chat--message--bot--background: #fff;
    --chat--message--bot--color: #1C1B19;
    --chat--message--bot--border: 1px solid #E5E0D5;
    --chat--message--user--background: #14204A;
    --chat--message--user--color: #fff;
    --chat--message--user--border: none;
    --chat--toggle--background: #C1121F;
    --chat--toggle--hover--background: #97121A;
    --chat--toggle--color: #fff;
    --chat--input--border: 1px solid #D8D1C3;
    --chat--input--border-active: 1px solid #C1121F;
  }
</style>
</head>
<body>
<div id="n8n-chat">
  <!-- Substituído por createChat() quando o widget carrega. Desde que o widget
       passou a ser servido do próprio site (vendor/n8n-chat/), o bundle é
       cacheável pelo Service Worker e carrega offline -- mas o webhook do n8n
       continua sendo origem externa, que o SW ignora de propósito. Ou seja: o
       widget agora até monta sem rede, e falha só ao enviar a mensagem. Este
       texto continua necessário como estado inicial e para o caso de o import
       falhar (J2 da auditoria). -->
  <p id="chat-offline-msg" style="padding:24px; font-size:14.5px; line-height:1.6; color:#6B6F7D;">O assistente virtual precisa de conexão com a internet. Verifique a rede e recarregue a página.</p>
</div>
<script type="module">
  import { createChat } from './vendor/n8n-chat/chat.bundle.es.js';

  // O widget chama scrollIntoView() nas mensagens para rolar ate a mais recente.
  // Por padrao essa API atravessa a fronteira do iframe e rola a pagina pai
  // tambem (comportamento normal da spec, nao um bug do navegador) — por isso
  // o site inteiro "pulava" a cada mensagem enviada. Substituimos por uma
  // versao que rola apenas o container com scroll mais proximo DENTRO deste
  // documento (o proprio chat), sem nunca tocar na janela pai.
  Element.prototype.scrollIntoView = function () {
    var node = this.parentElement;
    while (node && node !== document.documentElement) {
      var overflowY = getComputedStyle(node).overflowY;
      if (overflowY === 'auto' || overflowY === 'scroll') {
        node.scrollTop = this.offsetTop + this.offsetHeight - node.clientHeight + 24;
        return;
      }
      node = node.parentElement;
    }
  };

  createChat({
    webhookUrl: 'https://sternplatypus-n8n.cloudfy.live/webhook/ac8fae67-dc53-436e-981b-32751a37a991/chat',
    target: '#n8n-chat',
    mode: 'fullscreen',
    showWelcomeScreen: false,
    // false de proposito: com true, o widget reaproveita o mesmo sessionId salvo no
    // localStorage a cada carregamento da pagina, e esse sessionId e a chave que o n8n usa
    // pra puxar a memoria do agente (nome, municipio etc. ja mencionados). Com false, cada
    // vez que a pagina e recarregada nasce um sessionId novo — a memoria dura so a sessao
    // atual (enquanto a aba fica aberta), sem persistir entre recarregamentos.
    loadPreviousSession: false,
    allowFileUploads: true,
    allowedFilesMimeTypes: 'application/pdf',
    initialMessages: [
      'Olá! 👋 Sou o assistente do CAT Sertão (CBMPE).',
      'Posso ajudar com:\n- **AVCB / Atestado de Regularidade** — regularização do imóvel\n- **DDLCB** — declaração de dispensa de licenciamento\n- **TPEI/TFUSP** — taxa de bombeiros (valores, isenções, prazos)\n- **Evento Temporário** — shows, feiras e eventos\n- **Venda de fogos de artifício**\n- **SAVE** — eletropostos\n- **COSCIP-PE** — normas técnicas de segurança contra incêndio',
      'Em que posso ajudar você hoje?'
    ],
    i18n: {
      en: {
        title: 'Assistente do CAT Sertão',
        subtitle: 'Atendimento automático — pergunte à vontade.',
        footer: '',
        getStarted: 'Nova conversa',
        inputPlaceholder: 'Digite sua mensagem…',
        closeButtonTooltip: 'Fechar'
      }
    }
  });
</script>
</body>
</html>
